[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "concept-captioner"
version = "0.2.0"
description = "Concept-boundary captioning for diffusion LoRA training: any pydantic-ai model, Agent Skills instructions, Hugging Face datasets in and out."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hákon Freyr Gunnarsson" }]
keywords = ["captioning", "lora", "diffusion", "dataset", "huggingface", "pydantic-ai", "minimax-h3", "flux", "ltx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-ai-slim[openai,google,anthropic,openrouter]>=2.55,<3",
  "PyYAML>=6.0,<7",
  "Pillow>=10.4,<13",
  "httpx2>=2.12,<3",
]

[project.optional-dependencies]
hf = ["datasets>=3.0,<5", "huggingface_hub>=0.25,<2"]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1"]

[project.scripts]
concept-captioner = "concept_captioner.cli:main"

[project.urls]
Homepage = "https://github.com/RationallyPrime/concept-captioner"
Issues = "https://github.com/RationallyPrime/concept-captioner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/concept_captioner"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF012"]
