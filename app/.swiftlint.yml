included:
  - Sources
  - Tests
excluded:
  - .build
  - Sources/ConceptCore/Resources
line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true
identifier_name:
  min_length: 1
  max_length: 60
  excluded: [id, ok]
type_name:
  max_length: 60
large_tuple:
  warning: 3
  error: 4
function_parameter_count:
  warning: 8
  error: 10
file_length:
  warning: 600
  error: 1000
type_body_length:
  warning: 400
  error: 600
function_body_length:
  warning: 80
  error: 120
cyclomatic_complexity:
  warning: 15
  error: 25
disabled_rules:
  - todo
  - trailing_comma
  - opening_brace
