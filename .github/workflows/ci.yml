name: ci
on:
  push:
    branches: [main]
  pull_request:
env:
  # Tool versions come from mise.toml; mise's own version and Xcode's (swift job) are pinned here.
  MISE_VERSION: 2026.10.10
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: uv ruff pipx:ty
      - run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: ty check
      - run: uv run --no-sync pytest -q

  swift:
    name: swift (app/)
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: swiftlint swiftformat
      - run: swift --version
      - run: swift build
      - name: swift test (sampled and killed if it hangs for 5 minutes)
        run: ../.github/scripts/swift-test-watchdog.sh
      - run: swiftlint lint --strict --quiet
      - run: swiftformat Sources Tests --lint

  pod:
    name: pod (${{ matrix.tree }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tree: [agent, podctl, scripts]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: uv ruff pipx:ty
      - name: Install
        run: |
          if [ "${{ matrix.tree }}" = podctl ]; then
            cd pod/podctl && uv sync --locked --python 3.12
          else
            # scripts/ is tested from the agent venv (pod/README.md)
            cd pod/agent && uv sync --locked --extra pod --python 3.12
          fi
      - name: Test and lint
        working-directory: pod/${{ matrix.tree }}
        run: |
          if [ "${{ matrix.tree }}" = scripts ]; then py=../agent/.venv/bin; else py=.venv/bin; fi
          $py/python -m pytest tests -q
          ruff check .
          ruff format --check .
          ty check
