# Example job. Every value here is fictional. A real job lives next to your dataset, not in this repo.

# skill: ./my-captioning-skill   # an Agent Skills directory; omit for the bundled default
profile: h3-still                 # a profile in the skill (h3-still | flux-image | ltx-image | plain) or a path to a .md

concepts:
  - trigger: NORA7
    class_noun: woman
    target_concept: facial_identity
    traits_to_learn:
      - distinctive facial structure and features necessary for recognition
    attributes_to_describe:
      - clothing and removable accessories
      - hair presentation
      - expression and gaze
      - pose
      - visible physique
      - setting
      - lighting
      - framing and visible image treatment
    explicit_boundary_decisions:
      facial_geometry: Reserve for the identity trigger; do not describe facial morphology.
      eye_color: Reserve for the identity trigger.
      hair_color_and_styling: Describe visible presentation, including color when clear.
      physique: Describe observable build; outside this facial-identity concept.
      age: Do not infer exact age or biography.
  - trigger: IVAN9
    class_noun: man
    target_concept: facial_identity
    explicit_boundary_decisions:
      facial_geometry: Reserve for the identity trigger; do not describe facial morphology.
      eye_color: Reserve for the identity trigger.
      hair_color_and_styling: Describe visible presentation, including color when clear.

# sample id -> trigger -> locator. A locator is how the captioner binds a trigger to one visible person.
# null holds a sample for review without any model call. Never guess a mapping.
samples:
  solo.png:
    NORA7: The only person in the crop.
  pair.png:
    NORA7: The woman on the left.
    IVAN9: The man on the right.
  unmapped.png: null

single_subject_only: false
captioner_thinking: low
critic_thinking: high

# Endpoints are pydantic-ai models: kind is the provider prefix. Keys come from the environment
# (GOOGLE_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY, VLLM_API_KEY), never from here.
endpoints:
  captioner:
    kind: google
    model: gemini-3.8-flash
  critic:                         # optional; omit it and no critic runs
    kind: vllm
    model: Qwen/Qwen3-VL-32B-Instruct
    base_url: http://localhost:8000/v1
  # critic: { kind: anthropic,  model: claude-opus-5-5 }
  # critic: { kind: openrouter, model: anthropic/claude-sonnet-4-6, output_mode: prompted }
